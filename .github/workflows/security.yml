name: Security

# Runs on every pull request so untrusted changes are scanned before merge,
# plus a weekly sweep of main to catch signatures published after the fact.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  malware-scan:
    name: malware · clamav
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install ClamAV
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clamav
          # The packaged updater runs as a daemon and would race this job.
          sudo systemctl stop clamav-freshclam.service || true

      # The database lives in the package's own directory: freshclam drops to
      # the clamav user, which cannot traverse /home/runner, so a database
      # under $RUNNER_TEMP is invisible to it and must be re-downloaded here.
      - name: Update virus signatures
        run: |
          set -eu
          db_dir=/var/lib/clamav
          sudo mkdir -p "$db_dir"

          # freshclam exits 1 when NotifyClamd cannot reach a clamd that this
          # job never starts, even after a successful download, so the
          # database itself decides whether the update worked.
          have_db() {
            [ -n "$(sudo find "$db_dir" -maxdepth 1 \( -name '*.cvd' -o -name '*.cld' \) -print -quit)" ]
          }

          for attempt in 1 2 3; do
            sudo freshclam --stdout || true
            if have_db; then
              break
            fi
            echo "freshclam attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done

          if ! have_db; then
            echo "::error::ClamAV signature database is missing after update"
            exit 1
          fi

      - name: Scan repository
        run: |
          set -eu
          report_dir="$RUNNER_TEMP/scan-report"
          report="$report_dir/clamav.log"
          mkdir -p "$report_dir"

          set +e
          sudo clamscan \
            --recursive \
            --infected \
            --no-summary \
            --database=/var/lib/clamav \
            --max-filesize=50M \
            --max-scansize=200M \
            --max-files=50000 \
            --exclude-dir='^\.git$' \
            --exclude-dir='^node_modules$' \
            --exclude-dir='^dist$' \
            --exclude-dir='^coverage$' \
            --exclude-dir='^target$' \
            --exclude-dir='^test_snapshots$' \
            --exclude-dir='^\.pnpm-store$' \
            . >"$report" 2>&1
          status=$?
          set -e

          if [ -s "$report" ]; then
            tail -n 50 "$report"
          fi

          case "$status" in
            0)
              echo "No malware signatures detected."
              ;;
            1)
              while IFS= read -r line; do
                file="${line%%: *}"
                echo "::error file=${file}::Malware signature detected: ${line#*: }"
              done <"$report"
              echo "::error::ClamAV detected malware in this change; refusing to pass CI"
              exit 1
              ;;
            *)
              echo "::error::ClamAV scan failed with exit code $status"
              exit "$status"
              ;;
          esac

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clamav-report
          path: ${{ runner.temp }}/scan-report
          if-no-files-found: ignore
          retention-days: 30

  dependency-audit:
    name: dependencies · audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Advisory, not a gate: the graph is not public and the tree already
      # carries known advisories, so failing here would block every PR for
      # pre-existing debt. The summary still surfaces new high-severity ones.
      - name: Audit dependencies
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm audit --audit-level=high 2>&1 | tee "$RUNNER_TEMP/pnpm-audit.txt" || true
          if grep -q "vulnerabilities found" "$RUNNER_TEMP/pnpm-audit.txt"; then
            echo "::warning::pnpm audit reported high or critical advisories; see the job log"
          else
            echo "No high or critical advisories."
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-audit
          path: ${{ runner.temp }}/pnpm-audit.txt
          if-no-files-found: ignore
          retention-days: 30

  rust-advisories:
    name: contract · advisories · cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check Rust advisories
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
          manifest-path: contracts/keylease-core/Cargo.toml
          config: contracts/keylease-core/deny.toml
