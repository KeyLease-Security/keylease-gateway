name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm version comes from the "packageManager" field in package.json
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Typecheck (tsc --noEmit)
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r exec vitest run --coverage

      - name: Upload coverage summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pull-request-coverage
          path: |
            packages/*/coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            packages/*/coverage
            packages/*/dist
          if-no-files-found: ignore
          retention-days: 7

  coverage-comment:
    name: publish coverage
    if: github.event_name == 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install base dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate base coverage summaries
        run: pnpm -r exec vitest run --coverage

      - name: Download pull-request coverage summaries
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: pull-request-coverage
          path: .coverage/pr

      - name: Publish coverage comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -f scripts/coverage-comment.mjs ]; then
            node scripts/coverage-comment.mjs \
              --pr-coverage .coverage/pr \
              --base-coverage packages \
              --comment
          else
            echo "Coverage comment skipped: trusted comment script is not present on the base revision."
          fi

  contract:
    name: contract · test · wasm
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (wasm32v1-none)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/keylease-core

      # soroban-sdk 29 requires stellar-cli to produce a deployable wasm
      - name: Install stellar-cli
        run: |
          curl -sSL \
            https://github.com/stellar/stellar-cli/releases/download/v28.1.0/stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz \
            -o /tmp/stellar-cli.tar.gz
          tar -xzf /tmp/stellar-cli.tar.gz -C /usr/local/bin stellar
          stellar --version

      - name: Contract unit tests
        run: cargo test --manifest-path contracts/keylease-core/Cargo.toml

      - name: Build contract wasm
        run: cd contracts/keylease-core && stellar contract build

      - name: Upload contract wasm
        uses: actions/upload-artifact@v4
        with:
          name: keylease-core-wasm
          path: contracts/keylease-core/target/wasm32v1-none/release/keylease_core.wasm
          if-no-files-found: error
          retention-days: 30
